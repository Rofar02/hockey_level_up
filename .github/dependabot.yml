# Step 8 (security, 3): weekly dependency PRs. Minor/patch updates are
# grouped into one PR per ecosystem; majors come one by one, for a person
# to read the changelog.
version: 2
updates:
  - package-ecosystem: pip   # poetry.lock / pyproject.toml
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      backend-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      frontend-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/, /frontend]
    schedule:
      interval: weekly
    target-branch: dev

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
