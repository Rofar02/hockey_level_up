# Phase 2 of the certbot bootstrap (see bootstrap.conf) -- the live config
# once a certificate exists at /etc/letsencrypt/live/icelevel.ru/. Template,
# not the live config: the runbook copies this into deploy/nginx/active.conf
# (gitignored, mounted as /etc/nginx/conf.d/default.conf).
#
# Routing is by PATH, not subdomain: /api/* -> backend, everything else ->
# frontend. This keeps every request same-origin from the browser's point
# of view, so app/main.py's CORSMiddleware never even comes into play for
# the real deployment -- one less thing to get wrong.

limit_req_zone $binary_remote_addr zone=authzone:10m rate=10r/m;
# 2026-10-13 (А2): the session's own traffic -- /auth/refresh and /auth/me
# fire on every app start and every return from the background, and several
# phones behind one rink Wi-Fi share an IP. Under authzone a team opening the
# app at once got 429s, which used to look like a logout.
limit_req_zone $binary_remote_addr zone=sessionzone:10m rate=60r/m;
# Step 8 (security, 6): requests that send an email (registration, password
# reset, verification resend) -- each costs a Resend send and can be aimed
# at someone else's inbox -- and the coach chat, where every message is a
# paid LLM call (the app also caps messages per month).
limit_req_zone $binary_remote_addr zone=emailzone:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=coachzone:10m rate=6r/m;
limit_req_status 429;

# Content-Security-Policy (step 8, security, 4), one string for every block
# that sends it. Only what the app really loads: its own scripts/styles/
# fonts (the Tabler icon font is bundled), avatars/logos/posters from this
# origin, data:/blob: for the share card and recorded clips, YouTube embeds
# for exercises with a youtube video. 'unsafe-inline' for styles only --
# React style={...} attributes need it; scripts stay 'self'.
# Report-only for now: violations show in the browser console. Once a phone
# run shows none, rename the header in both add_header lines below to
# Content-Security-Policy.
map $host $icelevel_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
}

# Plain HTTP: keep the ACME webroot reachable for cert renewal, redirect
# everything else to HTTPS.
server {
    listen 80;
    server_name icelevel.ru www.icelevel.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://icelevel.ru$request_uri;
    }
}

# www -> apex redirect (kept on its own server block so the main block
# below doesn't have to branch on Host).
server {
    listen 443 ssl;
    http2 on;
    server_name www.icelevel.ru;

    ssl_certificate     /etc/letsencrypt/live/icelevel.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/icelevel.ru/privkey.pem;

    return 301 https://icelevel.ru$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name icelevel.ru;

    ssl_certificate     /etc/letsencrypt/live/icelevel.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/icelevel.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Precomputed at cert-issuance time (see docs/deploy.md) -- speeds up
    # the TLS handshake by skipping a DHE key exchange round-trip.
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only $icelevel_csp always;
    server_tokens off;

    # 5MB is the largest single upload the app allows today (see
    # app/services/user_service.py, team_service.py,
    # reference_article_service.py) -- 6m leaves headroom without opening
    # the door much wider than the app itself already does.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # No docs_url override exists in app/main.py -- /docs, /redoc and
    # /openapi.json are reachable by default. Block them at the edge
    # instead of touching backend code, so this is trivially reversible.
    # Must come before the general /api/ block below.
    location ~ ^/api/(docs|redoc|openapi\.json) {
        return 404;
    }

    # Exercise clips (mp4, ~1 MB each) and their poster frames, served by
    # nginx straight from disk -- never through the Python backend, so video
    # traffic can't compete with login/API requests for the backend workers.
    # Files are named after the clip id and never change content under the
    # same name (a replaced clip gets a new name), so a month of caching is
    # safe. Range requests (seeking) work out of the box for static files.
    # add_header inside a location replaces the server-level ones, so the
    # security headers are repeated here.
    location /media/exercise-videos/ {
        alias /srv/media/exercise-videos/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy-Report-Only $icelevel_csp always;
        try_files $uri =404;
    }

    # Session upkeep (refresh, me, logout, ...) -- see sessionzone above.
    location /api/auth/ {
        limit_req zone=sessionzone burst=30 nodelay;
        proxy_pass http://backend:8000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Anything that checks a password or a one-time link, plus the
    # email-taken probe -- a tighter cap against credential-stuffing,
    # brute-force and account enumeration. burst=10 absorbs a legitimate user
    # mistyping a password a few times in a row. Regex, so it wins over the
    # /api/auth/ prefix block above.
    location ~ ^/api/auth/(login|change-password|password-reset/confirm|verify-email/confirm|email-availability)$ {
        limit_req zone=authzone burst=10 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Requests that send an email -- regex, so it also wins over the prefix.
    location ~ ^/api/auth/(register|password-reset/request|verify-email/resend)$ {
        limit_req zone=emailzone burst=5 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Only sending a message -- history and feedback stay under /api/.
    location = /api/users/me/coach-chat {
        limit_req zone=coachzone burst=5 nodelay;
        proxy_pass http://backend:8000/users/me/coach-chat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An LLM reply can take a while.
        proxy_read_timeout 120s;
    }

    # Trailing slash on both sides = nginx strips the /api prefix before
    # forwarding (see Dockerfile.prod's --root-path /api, which is what
    # makes the backend aware of the prefix it's actually reachable under
    # for building correct redirect/OpenAPI URLs).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
