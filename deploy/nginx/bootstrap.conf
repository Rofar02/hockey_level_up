# Phase 1 of the certbot chicken-and-egg bootstrap: app.conf's `listen 443
# ssl` blocks reference certificate files that don't exist yet, so nginx
# refuses to start with app.conf active -- but the ACME HTTP-01 challenge
# needs a *working* nginx on port 80 to prove domain ownership before
# certbot will issue anything. This HTTP-only config is what runs during
# that gap. See docs/deploy.md for the exact swap sequence.
#
# This file is a template, not the live config -- docker-compose.prod.yml
# mounts deploy/nginx/active.conf (gitignored), which the runbook copies
# this file's contents into for the bootstrap phase.
server {
    listen 80;
    server_name icelevel.ru www.icelevel.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "IceLevel: certificate bootstrap in progress.\n";
        add_header Content-Type text/plain;
    }
}
