# Production stack for icelevel.ru. Deliberately a separate file from the
# dev docker-compose.yml, not an override -- too much diverges (real
# Dockerfiles instead of bind-mounted dev servers, an edge nginx + certbot,
# no published DB/MQ ports, real generated credentials). Usage:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# See docs/deploy.md for the full server runbook (DNS, first-boot, TLS
# bootstrap, seeding). Reads secrets from ./.env (gitignored, created by
# hand on the server from .env.prod.example -- never committed, so a
# `git pull` never touches it).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# 2026-09-19 audit round 3 item #6: shared across glitchtip_migrate/web/
# worker below rather than repeated three times. Backend-only for now --
# app/main.py's own sentry_sdk.init reaches glitchtip_web over this
# compose network by service name, no public exposure needed for that
# half. Browser-side (frontend) error tracking is a deliberately separate,
# not-yet-built follow-up: it would need GlitchTip reachable from outside
# the network entirely (a public subdomain + its own TLS cert), a bigger
# step than this pass took on.
x-glitchtip-env: &glitchtip-env
  DATABASE_URL: postgres://glitchtip:${GLITCHTIP_POSTGRES_PASSWORD}@glitchtip_postgres:5432/glitchtip
  REDIS_URL: redis://glitchtip_redis:6379/0
  SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
  PORT: "8080"
  # Only ever reachable via SSH tunnel (see glitchtip_web's own port
  # binding below) -- this value only affects links GlitchTip generates
  # in its own UI/emails, cosmetic here, not a real public URL.
  GLITCHTIP_DOMAIN: http://localhost:8080
  DEFAULT_FROM_EMAIL: glitchtip@icelevel.ru
  # 2026-09-20: real delivery via the same Resend account app/main.py's
  # own transactional emails already use (RESEND_API_KEY, already in
  # .env) -- Resend's SMTP relay (smtp.resend.com, username literally
  # "resend", password = the API key) rather than a second provider.
  # icelevel.ru is a verified sending domain on that account (confirmed
  # live via a direct Resend API send), so DEFAULT_FROM_EMAIL above
  # works as-is. This is issue-alert email only (new/regressed error ->
  # email to project members who opted in, configured per-project in
  # the GlitchTip UI) -- not a second signup/registration path;
  # ENABLE_USER_REGISTRATION stays off below regardless.
  #
  # smtp+tls://, not plain smtp:// -- django-environ's email_url() only
  # sets EMAIL_USE_TLS=True for the smtps/smtp+tls schemes (see its own
  # email_url_config source); plain smtp:// leaves EMAIL_USE_TLS unset,
  # and Resend's server on :587 requires STARTTLS before AUTH, so a
  # plain smtp:// scheme here 538'd ("Must issue a STARTTLS command
  # first") -- confirmed live, then confirmed the smtp+tls:// fix live
  # too before committing it.
  EMAIL_URL: smtp+tls://resend:${RESEND_API_KEY}@smtp.resend.com:587
  ENABLE_USER_REGISTRATION: "false"
  ENABLE_ORGANIZATION_CREATION: "false"
  CELERY_WORKER_AUTOSCALE: "1,3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging
    # No `ports:` -- only reachable from other containers on the compose
    # network, by service name. This is the single biggest exposure fix
    # over the dev compose file, which publishes 5432 to the host.

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    # No `ports:` -- the 15672 management UI stays unreachable from the
    # internet. Use `docker compose exec rabbitmq rabbitmqctl ...` or an
    # SSH tunnel if you need to look inside it.

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Same reasoning as the dev compose file: inside the compose network
      # services reach each other by service name, not localhost -- this
      # overrides whatever .env has for a non-Docker local run.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      # GLITCHTIP_DSN itself is NOT restated here -- unlike the two
      # above, it needs no docker-network rewrite, so it flows straight
      # through from .env via env_file below, same as ZAI_API_KEY/
      # RESEND_API_KEY already do.
    volumes:
      # Named, not bind-mounted: Dockerfile.prod creates+chowns these paths
      # for the non-root `appuser` before the volume is attached, so a
      # fresh named volume inherits that ownership. A host bind mount would
      # come in root-owned and every upload would fail with a permission
      # error. Mounted at the three subdirectories specifically, not at
      # the parent static/ -- that would shadow static/logo/, which ships
      # with the image (tracked in git).
      - avatars_data:/app/static/avatars
      - reference_articles_data:/app/static/reference-articles
      - team_logos_data:/app/static/team-logos
    depends_on:
      # Required, not optional: app/events/consumer.py's initial RabbitMQ
      # connect attempt gives up permanently (logs "consumer disabled" and
      # returns) if RabbitMQ isn't reachable yet -- connect_robust only
      # auto-reconnects *after* a successful first connect. Starting
      # backend before rabbitmq is healthy silently breaks XP/stat/streak
      # processing for the container's entire lifetime.
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    logging: *default-logging
    # No `ports:` -- only the edge nginx talks to this, over the compose
    # network at http://backend:8000.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    logging: *default-logging
    # No `ports:` -- serves the static build to the edge nginx only, at
    # http://frontend:80.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    logging: *default-logging

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Renews once per day if the cert is within its renewal window
    # (certbot no-ops otherwise); nginx isn't reloaded automatically here
    # on purpose, see docs/deploy.md for the reload-after-renew cron entry.
    entrypoint: >
      sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 24h & wait $${!};
      done;'
    logging: *default-logging

  # 2026-09-19 audit round 3 item #6: error/exception tracking -- see
  # docs/deploy.md section 13 for the one-time setup (create the org/
  # project, generate a DSN, create the admin login). Backend-only for
  # now (see x-glitchtip-env's own comment above); nothing here is
  # reachable from the internet, checked the same way section 12's smoke
  # test already checks 5432/5672/15672 aren't.
  glitchtip_postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_POSTGRES_PASSWORD}
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging
    # Its own Postgres instance, deliberately not a second database on
    # the app's own `postgres` service above: that server's data
    # directory is already initialized on a running prod server (the
    # official image's initdb.d bootstrap scripts only ever run once,
    # against a genuinely empty volume), so adding a second database
    # there would need a manual one-off `CREATE DATABASE` anyway. A
    # fully separate instance needs zero coordination with the app's own
    # DB/backups/restore and can never collide with or slow down it.

  glitchtip_redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - glitchtip_redis_data:/data
    logging: *default-logging

  # One-shot: runs `manage.py migrate` and exits, no restart policy --
  # web/worker below wait on it via service_completed_successfully.
  # NOT automatically re-run by a later `docker compose up -d` once it
  # has already exited successfully once (compose only recreates a
  # service whose config changed) -- if the glitchtip image tag is ever
  # bumped, re-run `docker compose -f docker-compose.prod.yml run --rm
  # glitchtip_migrate` by hand first, same as any other schema change.
  glitchtip_migrate:
    image: glitchtip/glitchtip:latest
    command: ./manage.py migrate
    environment: *glitchtip-env
    depends_on:
      glitchtip_postgres:
        condition: service_healthy
    logging: *default-logging

  glitchtip_web:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    environment: *glitchtip-env
    depends_on:
      glitchtip_postgres:
        condition: service_healthy
      glitchtip_redis:
        condition: service_started
      glitchtip_migrate:
        condition: service_completed_successfully
    volumes:
      - glitchtip_uploads:/code/uploads
    ports:
      # 127.0.0.1 only, NEVER 0.0.0.0 -- an internal ops dashboard (error
      # list + one admin login), not something the public internet
      # should even know exists. Reach it with
      # `ssh -L 8080:localhost:8080 root@<server ip>` then open
      # http://localhost:8080 -- same tunnel-only pattern the rabbitmq
      # management UI (15672) already uses.
      - "127.0.0.1:8080:8080"
    logging: *default-logging

  glitchtip_worker:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    command: ./bin/run-celery-with-beat.sh
    environment: *glitchtip-env
    depends_on:
      glitchtip_postgres:
        condition: service_healthy
      glitchtip_redis:
        condition: service_started
      glitchtip_migrate:
        condition: service_completed_successfully
    volumes:
      - glitchtip_uploads:/code/uploads
    logging: *default-logging

volumes:
  postgres_data:
  rabbitmq_data:
  avatars_data:
  reference_articles_data:
  team_logos_data:
  certbot_etc:
  certbot_www:
  glitchtip_postgres_data:
  glitchtip_redis_data:
  glitchtip_uploads:
