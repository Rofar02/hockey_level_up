# Serves the built Vite SPA. This nginx is internal-only -- the edge nginx
# (deploy/nginx/app.conf) is what actually terminates TLS and faces the
# internet, proxying everything except /api/* here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # BrowserRouter (see frontend/src/main.tsx) means every deep path
    # (/login, /verify-email, /reset-password, etc.) is a client-side
    # route -- without this fallback, a direct hit (e.g. the link in a
    # verification email) 404s instead of loading the app shell.
    # Everything served from here (index.html, sw.js, manifest, public/
    # images and icons) keeps a fixed name across deploys, so the browser
    # revalidates it on every load -- a cheap 304 when unchanged, the new
    # file right after a deploy. index.html especially: it's what points at
    # the current hashed asset names.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Only Vite's build output lives here, and Vite content-hashes every
    # filename in it on each build -- a cached copy can never go stale under
    # a reused name, so it's safe to cache "forever". Scoped to /assets/ on
    # purpose (2026-10-02): the old extension-based regex also caught
    # public/ files that keep their name across deploys (logo, arena
    # background, favicons, icons, sw.js), pinning old copies for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # A chunk from an older build 404s instead of falling back to
        # index.html -- the app's stale-chunk reload handles the failure.
        try_files $uri =404;
    }
}
