# Serves the built Vite SPA. This nginx is internal-only -- the edge nginx
# (deploy/nginx/app.conf) is what actually terminates TLS and faces the
# internet, proxying everything except /api/* here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # BrowserRouter (see frontend/src/main.tsx) means every deep path
    # (/login, /verify-email, /reset-password, etc.) is a client-side
    # route -- without this fallback, a direct hit (e.g. the link in a
    # verification email) 404s instead of loading the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite content-hashes these filenames on every build, so a cached copy
    # can never go stale under a reused name -- safe to cache "forever".
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|webp|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # These three are read fresh on every load by design: index.html is
    # what points at the current hashed asset names, sw.js is the service
    # worker (browsers already refuse to cache it long), and the manifest
    # can change (icons, name) independently of a JS deploy.
    location ~* ^/(index\.html|sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }
}
